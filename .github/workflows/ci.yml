name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.10"

      - name: Install dependencies (frozen, zero-compile)
        run: uv sync --frozen

      - name: Run gate (lint + types + tests + emoji scan)
        run: uv run python tools/verify.py

      - name: Smoke - start API and check health
        run: |
          uv run uvicorn veritas.app:app --port 8000 &
          sleep 6
          curl -sf http://127.0.0.1:8000/health
          curl -sf -X POST http://127.0.0.1:8000/api/v1/eval/run
        shell: bash
